name: GitHub Pages 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 사이트 주소(/)로 들어오면 데모가 바로 열리게 index.html로도 복사한다
      - name: 사이트 파일 모으기
        run: |
          mkdir _site
          cp -r vendor finger-sports-day-demo.html finger-sports-day-v2.html _site/
          cp finger-sports-day-demo.html _site/index.html
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
